<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>기생충 — B1관 입장권</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
  <style>
    :root { --ink: #141414; --paper: #ECE8DF; --glow: #F2D48C; --bar: 11vh; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { font-family: 'Pretendard', -apple-system, sans-serif; color: var(--paper); }
    #container { position: fixed; inset: 0; }
    #container video { object-fit: cover; }
    #touchArea { position: fixed; inset: 0; z-index: 5; touch-action: none; }

    /* 시네마 레터박스 */
    .bar { position: fixed; left: 0; right: 0; height: calc(var(--bar) + env(safe-area-inset-top)); background: #000; z-index: 15;
           display: flex; align-items: flex-end; justify-content: space-between; padding: 0 5vw 2.2vh; pointer-events: none; }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; height: calc(var(--bar) + env(safe-area-inset-bottom)); align-items: flex-start;
                  padding-top: 2vh; justify-content: center; gap: 8px; pointer-events: auto; }
    .bar .hall { font-size: 12px; letter-spacing: .18em; color: #8f8a82; }
    .bar .hall b { color: var(--paper); letter-spacing: .04em; font-weight: 700; margin-right: .5em; }
    #status { font-size: 12px; letter-spacing: .02em; color: var(--paper); }
    .bar button { border: 1px solid #4a4741; background: transparent; color: var(--paper); font: 500 13px 'Pretendard', sans-serif;
                  padding: 9px 13px; border-radius: 999px; touch-action: manipulation; }
    .bar button.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }

    /* 자막(모스 → 기우), 엔드 크레딧 */
    #sub { position: fixed; left: 0; right: 0; bottom: calc(var(--bar) + 3.2vh + env(safe-area-inset-bottom)); z-index: 14; text-align: center;
           pointer-events: none; font: 500 15px 'Pretendard', sans-serif; letter-spacing: .32em; color: var(--glow);
           text-shadow: 0 0 10px rgba(242,212,140,.55), 0 1px 3px #000; opacity: 0; }
    #sub.word { font-size: 30px; font-weight: 700; letter-spacing: .5em; color: var(--paper); }
    #credits { position: fixed; left: 0; right: 0; top: calc(var(--bar) + 3vh + env(safe-area-inset-top)); z-index: 14; text-align: center;
               pointer-events: none; font-size: 11px; line-height: 1.7; letter-spacing: .06em; color: #cfcac0; opacity: 0;
               text-shadow: 0 1px 3px #000; }
    #credits b { display: block; font-size: 13px; color: var(--paper); letter-spacing: .12em; margin-bottom: 2px; }

    /* 접속: 필름 리더 카운트다운 */
    #leader { position: fixed; inset: 0; z-index: 30; background: #111; display: flex; align-items: center; justify-content: center;
              transition: opacity .6s ease; }
    #leader.gone { opacity: 0; pointer-events: none; }
    .dial { position: relative; width: 62vmin; height: 62vmin; border-radius: 50%; }
    .dial::before, .dial::after { content: ''; position: absolute; background: #6b675f; }
    .dial::before { left: 50%; top: -12vmin; bottom: -12vmin; width: 1px; }
    .dial::after { top: 50%; left: -12vmin; right: -12vmin; height: 1px; }
    .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid #8f8a82; }
    .ring.in { inset: 9%; }
    .sweep { position: absolute; inset: 0; border-radius: 50%;
             background: conic-gradient(rgba(236,232,223,.22) var(--a, 0deg), transparent 0); }
    #count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font: 900 30vmin 'Pretendard', serif; color: var(--paper); line-height: 1; }
    #leaderNote { position: absolute; bottom: 14vh; left: 0; right: 0; text-align: center; font-size: 13px; color: #8f8a82; letter-spacing: .04em; }

    /* 티켓 비추기 안내(티켓 1:2) */
    #guide { position: fixed; z-index: 8; left: 50%; top: 50%; height: min(58vh, 92vw); aspect-ratio: 74 / 148; transform: translate(-50%, -50%);
             border: 1px dashed rgba(236,232,223,.75); border-radius: 6px; pointer-events: none; transition: opacity .4s; }
    #guide span { position: absolute; left: -40vw; right: -40vw; bottom: -34px; text-align: center; font-size: 13px; color: var(--paper);
                  text-shadow: 0 1px 4px #000; }
    #guide.hide { opacity: 0; }

    /* 미리보기 영상: 손가락 표시 */
    #finger { position: fixed; z-index: 20; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
              background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.8); opacity: 0; pointer-events: none; }

    /* 번개 */
    #flash { position: fixed; inset: 0; z-index: 12; background: #f4f7ff; opacity: 0; pointer-events: none; }

    #startButton { display: none; position: fixed; z-index: 40; left: 50%; top: 50%; transform: translate(-50%, -50%);
                   border: 0; border-radius: 999px; background: var(--paper); color: var(--ink); font: 600 16px 'Pretendard', sans-serif; padding: 14px 24px; }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="touchArea"></div>
  <div id="guide"><span>티켓을 테두리에 맞춰 비춰 주세요</span></div>
  <div id="flash"></div>
  <div id="finger"></div>
  <div id="sub"></div>
  <div id="credits"></div>

  <div class="bar top"><span class="hall"><b>B1</b>기생충</span><span id="status">AR 준비 중</span></div>
  <div class="bar bottom">
    <button id="soundButton">소리 켜기</button>
    <button id="filmButton">본편 보기</button>
    <button id="replay">다시 보기</button>
    <button id="reset">처음 자리로</button>
  </div>

  <div id="leader">
    <div class="dial"><div class="sweep" id="sweep"></div><div class="ring"></div><div class="ring in"></div><div id="count">3</div></div>
    <div id="leaderNote">곧 상영을 시작합니다</div>
  </div>
  <button id="startButton">카메라 시작</button>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MindARThree } from "mindar-image-three";

    // ───────── 설정 ─────────
    // wall: 벽에 붙인 티켓(기본) / table: 책상에 눕힌 티켓  →  주소 뒤에 ?mode=table
    const params = new URLSearchParams(location.search);
    const MODE = params.get("mode") === "table" ? "table" : "wall";
    const SKIP_INTRO = params.has("nointro");

    const FILES = {
      target: "./media/targets.mind",
      model: "./media/tent.glb",
      stairs: "./media/stairs.jpg",        // 벽 속 창 너머: 지하로 내려가는 계단(C4D 렌더)
      pane: "./media/pane_off.jpg",        // 티켓 창 부분(모스 빛을 끈 판) — 이 판이 안쪽으로 열린다
      video: "./media/film.mp4",           // 본편(선택)
      thunder: "./media/thunder.mp3",
      rain: "./media/rain.mp3"
    };

    // 티켓 치수(mm) → 마커 좌표(가로 1 = 74mm, 가운데가 원점, 위가 +y)
    const T_W = 74, T_H = 148;
    const mm = v => v / T_W;
    const MARKER_H = T_H / T_W;
    const rectFromTop = (left, top, w, h) => ({ x: mm(left + w / 2) - 0.5, y: mm(T_H / 2 - (top + h / 2)), w: mm(w), h: mm(h) });
    const HOLE = rectFromTop(6, 31, 62, 72.5);        // 벽 속으로 열리는 창
    const STUB_Y = mm(T_H / 2 - 106);                 // 절취선 = 땅선
    const PORTAL_D = 0.9;                             // 창 안쪽 깊이

    // 모스 「기우」 = ㄱ ㅣ ㅇ ㅜ
    const MORSE = [".-..", "..-", "-.-", "...."];
    const MORSE_TXT = ["· − · ·", "· · −", "− · −", "· · · ·"];
    const MC = { cx: 37, top: 42, unit: 1.25 };        // 티켓에 인쇄된 빛 기둥(mm)
    const BAR = { x: 5, y: 126, w: 37, h: 6.4 };       // 반권 바코드(mm)
    const U = 0.1;                                    // 모스 한 칸 = 0.1초
    const ELS = (() => {                              // 점 1칸, 선 3칸, 점·선 사이 1칸, 글자 사이 3칸
      let pos = 0; const out = [];
      MORSE.forEach((L, li) => {
        [...L].forEach((s, si) => { const len = s === "." ? 1 : 3; out.push({ s: pos, len, li }); pos += len + (si < L.length - 1 ? 1 : 0); });
        if (li < MORSE.length - 1) pos += 3;
      });
      return { total: pos, els: out };
    })();

    // 연출 시간표(초, 인식된 순간부터)
    const T = { off: [0.2, 0.7], morse0: 0.9, allOn: 0, open: 0, tent: 0, credits: 0 };
    T.allOn = T.morse0 + ELS.total * U + 0.15;
    T.open = T.allOn + 0.8;
    T.tent = T.open + 0.9;
    T.credits = T.open + 4.5;

    const TENT_SIZE = 0.40;
    const PLACE = {
      wall:  { tent: new THREE.Vector3(0.24, STUB_Y, 0.14), screen: new THREE.Vector3(0, MARKER_H / 2 + 0.10, 0.02) },
      table: { tent: new THREE.Vector3(0.24, 0, -STUB_Y), screen: new THREE.Vector3(0, 0.10, -(MARKER_H / 2 + 0.06)) }
    }[MODE];
    const SCREEN_W = 1.6;

    // ───────── AR 기본 ─────────
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const soundButton = document.getElementById("soundButton");
    const filmButton = document.getElementById("filmButton");
    const touchArea = document.getElementById("touchArea");
    const guide = document.getElementById("guide");
    const subEl = document.getElementById("sub");
    const creditsEl = document.getElementById("credits");

    // ?demo: 녹화 미리보기 — 카메라 대신 가상의 벽과 인쇄 티켓을 그리고, 같은 연출 코드를 프레임 단위로 돌린다
    const DEMO = params.has("demo");
    let demoClock = 0;
    const clockNow = () => (DEMO ? demoClock * 1000 : performance.now());
    let mindarThree = null, renderer, scene, camera, anchor, bgScene = null;
    if (!DEMO) {
      mindarThree = new MindARThree({
        container: document.querySelector("#container"),
        imageTargetSrc: FILES.target,
        maxTrack: 1,
        uiLoading: "no", uiScanning: "no", uiError: "no",
        filterMinCF: 0.001, filterBeta: 50
      });
      ({ renderer, scene, camera } = mindarThree);
      anchor = mindarThree.addAnchor(0);
    } else {
      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
      document.getElementById("container").appendChild(renderer.domElement);
      scene = new THREE.Scene(); bgScene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.01, 100);
      anchor = { group: new THREE.Group() }; scene.add(anchor.group);
    }
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // 벽/책상 모드에 따라 '세워지는' 물체(텐트·비·스크린)를 담는 무대
    const stage = new THREE.Group();
    if (MODE === "table") stage.rotation.x = Math.PI / 2;
    anchor.group.add(stage);
    const modelMoveGroup = new THREE.Group();
    const backgroundMoveGroup = new THREE.Group();
    stage.add(modelMoveGroup, backgroundMoveGroup);
    const screenHome = PLACE.screen.clone();
    backgroundMoveGroup.position.copy(screenHome);

    // 티켓 면에 붙는 층(창·빛): 항상 마커 평면 기준
    const ticketLayer = new THREE.Group();
    anchor.group.add(ticketLayer);

    scene.add(new THREE.HemisphereLight(0xfff4e6, 0x30302c, 1.4));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(-1, 2, 3);
    scene.add(key);

    const texLoader = new THREE.TextureLoader();
    const loadTex = (url) => new Promise((res) => texLoader.load(url, (t) => { t.colorSpace = THREE.SRGBColorSpace; res(t); }, undefined, () => res(null)));
    const srgb = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);

    function radialTex(inner = "rgba(255,236,190,1)", outer = "rgba(242,212,140,0)") {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d"); const grd = g.createRadialGradient(64, 64, 2, 64, 64, 63);
      grd.addColorStop(0, inner); grd.addColorStop(0.35, "rgba(242,212,140,.45)"); grd.addColorStop(1, outer);
      g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    }
    const GLOW_TEX = radialTex();

    // ───────── ① 창 덮개(빛을 끈 판) — 안쪽으로 열리는 반지하 창 ─────────
    const panePivot = new THREE.Group();                       // 위쪽 가장자리를 경첩으로
    panePivot.position.set(HOLE.x, HOLE.y + HOLE.h / 2, 0.0008);
    const paneMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, color: 0xffffff });
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(HOLE.w, HOLE.h), paneMat);
    pane.position.y = -HOLE.h / 2;
    pane.renderOrder = 2;
    panePivot.add(pane);
    ticketLayer.add(panePivot);
    loadTex(FILES.pane).then((t) => { if (t) { paneMat.map = t; paneMat.needsUpdate = true; } });

    // ───────── ② 모스 빛(인쇄된 빛 기둥 위에 겹침) ─────────
    const glowGroup = new THREE.Group(); glowGroup.position.z = 0.002; ticketLayer.add(glowGroup);
    const glowOrder = (m) => { m.renderOrder = 3; return m; };   // 창 덮개(2)보다 나중에 그려야 보인다
    const columnHalo = new THREE.Mesh(new THREE.PlaneGeometry(mm(34), mm(ELS.total * MC.unit + 30)),
      new THREE.MeshBasicMaterial({ map: GLOW_TEX, transparent: true, opacity: 0, depthWrite: false }));
    columnHalo.position.set(mm(MC.cx) - 0.5, mm(T_H / 2 - (MC.top + ELS.total * MC.unit / 2)), 0);
    glowGroup.add(glowOrder(columnHalo));
    // 점·선 모양(둥근 막대) — 길이마다 비율에 맞게 그린다
    function capsuleTex(len) {
      const H = Math.round(32 * (len + 1) / 2);
      const c = document.createElement("canvas"); c.width = 32; c.height = H;
      const g = c.getContext("2d"); g.shadowColor = "rgba(255,226,150,1)"; g.shadowBlur = 7; g.fillStyle = "#FFF1C8";
      g.beginPath(); g.roundRect(8, 8, 16, H - 16, 8); g.fill();
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    }
    const lights = ELS.els.map((e) => {
      const h = e.len * MC.unit, w = MC.unit;
      const core = new THREE.Mesh(new THREE.PlaneGeometry(w * 2, h + w), new THREE.MeshBasicMaterial({ map: capsuleTex(e.len), transparent: true, opacity: 0, depthWrite: false }));
      const halo = new THREE.Mesh(new THREE.PlaneGeometry(mm(9), mm(h + 7)), new THREE.MeshBasicMaterial({ map: GLOW_TEX, transparent: true, opacity: 0, depthWrite: false }));
      const y = mm(T_H / 2 - (MC.top + e.s * MC.unit + h / 2));
      core.scale.set(1 / T_W, 1 / T_W, 1); core.position.set(mm(MC.cx) - 0.5, y, 0.0004);
      halo.position.set(mm(MC.cx) - 0.5, y, 0.0002);
      glowGroup.add(glowOrder(halo), glowOrder(core));
      // 반권 바코드의 같은 막대도 함께 켜진다
      const u = BAR.w / ELS.total;
      const bar = new THREE.Mesh(new THREE.PlaneGeometry(mm(e.len * u), mm(BAR.h)), new THREE.MeshBasicMaterial({ color: 0xF6DD97, transparent: true, opacity: 0, depthWrite: false }));
      bar.position.set(mm(BAR.x + (e.s + e.len / 2) * u) - 0.5, mm(T_H / 2 - (BAR.y + BAR.h / 2)), 0.0004);
      glowGroup.add(glowOrder(bar));
      return { e, core, halo, bar, v: 0 };
    });

    // ───────── ③ 벽 속 창(포털): 가림막 + 안쪽 상자 + 계단 ─────────
    const portal = new THREE.Group(); portal.visible = false; ticketLayer.add(portal);
    const x0 = HOLE.x - HOLE.w / 2, x1 = HOLE.x + HOLE.w / 2, y0 = HOLE.y - HOLE.h / 2, y1 = HOLE.y + HOLE.h / 2;
    {
      // 가림막: 창 구멍만 뚫린 투명 판(색은 안 그리고 깊이만 써서, 벽 밖으로 삐져나온 상자를 가린다)
      const B = 8, shape = new THREE.Shape();
      shape.moveTo(-B, -B); shape.lineTo(B, -B); shape.lineTo(B, B); shape.lineTo(-B, B); shape.lineTo(-B, -B);
      const hole = new THREE.Path(); hole.moveTo(x0, y0); hole.lineTo(x0, y1); hole.lineTo(x1, y1); hole.lineTo(x1, y0); hole.lineTo(x0, y0);
      shape.holes.push(hole);
      const occ = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ colorWrite: false }));
      occ.renderOrder = -1; portal.add(occ);
    }
    // 안쪽 벽: 창 쪽은 검게, 깊은 쪽은 계단 렌더 가장자리 색으로
    const FRONT = srgb(0.015, 0.012, 0.01);
    const BACK = { left: srgb(0.184, 0.137, 0.105), right: srgb(0.08, 0.049, 0.027), top: srgb(0.156, 0.101, 0.063), bottom: srgb(0.158, 0.154, 0.147) };
    const D = -PORTAL_D;
    function wall(a, b, c, d, cf, cb) {      // a,b = 창 쪽 / c,d = 깊은 쪽
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute([...a, ...b, ...c, ...a, ...c, ...d], 3));
      const col = [cf, cf, cb, cf, cb, cb].flatMap((k) => [k.r, k.g, k.b]);
      g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
      return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    }
    portal.add(
      wall([x0, y0, 0], [x0, y1, 0], [x0, y1, D], [x0, y0, D], FRONT, BACK.left),
      wall([x1, y1, 0], [x1, y0, 0], [x1, y0, D], [x1, y1, D], FRONT, BACK.right),
      wall([x0, y1, 0], [x1, y1, 0], [x1, y1, D], [x0, y1, D], FRONT, BACK.top),
      wall([x1, y0, 0], [x0, y0, 0], [x0, y0, D], [x1, y0, D], FRONT, BACK.bottom)
    );
    const stairsMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const stairs = new THREE.Mesh(new THREE.PlaneGeometry(HOLE.w, HOLE.h), stairsMat);
    stairs.position.set(HOLE.x, HOLE.y, D);
    portal.add(stairs);
    loadTex(FILES.stairs).then((t) => { if (t) { stairsMat.map = t; stairsMat.needsUpdate = true; } });
    // 계단 아래 벽등: 이 빛이 신호를 보내던 곳
    const lamp = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.22), new THREE.MeshBasicMaterial({ map: GLOW_TEX, transparent: true, opacity: 0, depthWrite: false }));
    lamp.position.set(x0 + 0.413 * HOLE.w, y1 - 0.528 * HOLE.h, D + 0.003);
    portal.add(lamp);
    // 창틀
    const frameMat = new THREE.MeshBasicMaterial({ color: 0x0b0b0a });
    const ft = mm(1.4), fd = 0.03;
    [[HOLE.x, y1 - ft / 2, HOLE.w, ft], [HOLE.x, y0 + ft / 2, HOLE.w, ft], [x0 + ft / 2, HOLE.y, ft, HOLE.h], [x1 - ft / 2, HOLE.y, ft, HOLE.h]].forEach(([x, y, w, h]) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, fd), frameMat); m.position.set(x, y, -fd / 2); portal.add(m);
    });
    // 창에서 새어 나오는 따뜻한 빛(텐트를 비춘다)
    const windowLight = new THREE.PointLight(0xffc477, 0, 1.6, 1);
    windowLight.position.set(HOLE.x, y0 + 0.1, 0.12);
    ticketLayer.add(windowLight);

    // ───────── ④ 텐트(오브젝트) ─────────
    let modelRoot = null, initialFitScale = 1;
    const tentHolder = new THREE.Group();
    tentHolder.position.copy(PLACE.tent);
    tentHolder.scale.setScalar(0.0001);
    modelMoveGroup.add(tentHolder);
    const shadowTex = (() => {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d"); const grd = g.createRadialGradient(64, 64, 4, 64, 64, 62);

    // ───────── 시작(필름 리더 → 카메라) ─────────

    document.getElementById("reset").addEventListener("click", () => {

    // ───────── 손가락 조작(교수님 코드 방식) ─────────

        if (singleStartTarget === "background") {
          if (!tapCandidate && video && videoReady && video.duration > 0)
            video.currentTime = THREE.MathUtils.clamp(video.currentTime + (dx / innerWidth) * video.duration * SEEK_SCREEN_WIDTH_RATIO, 0, video.duration);
        } else if (singleStartTarget === "bar") seekFromScreen(e.clientX, e.clientY);
        else if (modelRoot) { modelRoot.rotation.y += dx * ROTATION_SPEED; modelRoot.rotation.x += dy * ROTATION_SPEED; }
        previousX = e.clientX; previousY = e.clientY;
      } else if (activePointers.size === 2) {
        if (dragTarget && pinchStartDistance > 0) {
          const s = pinchStartScale * (pinchDist() / pinchStartDistance);
          if (dragTarget === modelMoveGroup && modelRoot) modelRoot.scale.setScalar(THREE.MathUtils.clamp(s, initialFitScale * 0.1, initialFitScale * 10));
          else if (dragTarget) dragTarget.scale.setScalar(THREE.MathUtils.clamp(s, 0.1, 10));
        }
        const m = pinchMid();
        if (m && dragTarget) {
          if (!dragHasPrev) dragHasPrev = screenToStage(m.x, m.y, dragPrev);
          else if (screenToStage(m.x, m.y, dragCurr)) { dragTarget.position.add(dragCurr.clone().sub(dragPrev)); dragPrev.copy(dragCurr); }
        }
      }
    });
    function stopPointer(e) {
      if (!activePointers.has(e.pointerId)) return;
      if (e.type === "pointerup" && activePointers.size === 1 && tapCandidate && singleStartTarget === "background" &&
          performance.now() - tapStartTime < TAP_MAX_TIME) toggleVideo();
      tapCandidate = false; singleStartTarget = null;
      activePointers.delete(e.pointerId);
      dragHasPrev = false; dragTarget = null;
      updateStatus();
      if (activePointers.size === 1) { const r = [...activePointers.values()][0]; previousX = r.x; previousY = r.y; }
      else if (activePointers.size === 0) pinchStartDistance = 0;
    }
    touchArea.addEventListener("pointerup", stopPointer);
    touchArea.addEventListener("pointercancel", stopPointer);
    touchArea.addEventListener("lostpointercapture", stopPointer);

    // ───────── 미리보기 영상(?demo) — 휴대폰 화면 녹화를 흉내 낸다 ─────────
    // 가상 벽(사진) 위에 오려 붙인 티켓을 '카메라 화면'으로 먼저 그리고, 그 위에 AR 층을 그린다.
    if (DEMO) {
      const F = 4.6;                                  // 티켓이 인식되는 순간(영상 시간)
      const FILM_AT = 19.6;                           // '본편 보기'를 누르는 순간(인식 후)
      const FILM_LEN = 8.6;                          // 본편을 보여 주는 길이
      const END = F + 31.3;
      const fingerEl = document.getElementById("finger");
      const fadeEl = Object.assign(document.createElement("div"), { style: "position:fixed;inset:0;background:#000;z-index:50;opacity:0;pointer-events:none" });
      document.body.appendChild(fadeEl);
      [leader, guide].forEach((el) => (el.style.transition = "none"));
      soundButton.textContent = "소리 끄기"; soundButton.classList.add("on");
      started = true; updateStatus();
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();

      const [wallTex, tkTex] = await Promise.all([loadTex("./demo/wall.jpg"), loadTex("./demo/ticket_cut.png")]);
      const wall = new THREE.Mesh(new THREE.PlaneGeometry(7, 7 * 1536 / 864), new THREE.MeshBasicMaterial({ map: wallTex }));
      wall.position.set(0, 0.5, -0.003); bgScene.add(wall);
      const paperShadow = (() => {
        const c = document.createElement("canvas"); c.width = 200; c.height = 340;
        const g = c.getContext("2d"); g.filter = "blur(7px)"; g.fillStyle = "#000";
        g.beginPath(); g.roundRect(54, 76, 92, 192, 6); g.fill();              // 티켓(100×200)보다 살짝 작게, 아래로 조금 밀림
        const t = new THREE.CanvasTexture(c); return t;
      })();
      const ps = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 3.4), new THREE.MeshBasicMaterial({ map: paperShadow, transparent: true, opacity: .45, depthWrite: false }));
      ps.position.z = -0.002; bgScene.add(ps);
      const tk = new THREE.Mesh(new THREE.PlaneGeometry(1, MARKER_H), new THREE.MeshBasicMaterial({ map: tkTex, transparent: true }));
      bgScene.add(tk);
      [[-0.46, MARKER_H / 2 - 0.04, 0.6], [0.46, MARKER_H / 2 - 0.04, -0.6]].forEach(([x, y, r]) => {   // 마스킹 테이프
        const tape = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.12), new THREE.MeshBasicMaterial({ color: 0xe9dfc6, transparent: true, opacity: .82 }));
        tape.position.set(x, y, 0.001); tape.rotation.z = r; bgScene.add(tape);
      });

      // 카메라 길(영상 시간, 위치, 보는 곳)
      const K = [
        [0.0, [0.40, -0.30, 4.7], [0.05, -0.05, 0]],
        [3.0, [0.28, -0.18, 4.0], [0.03, -0.05, 0]],
        [F, [0.02, -0.05, 3.1], [0, -0.05, 0]],
        [F + 7.6, [0.0, -0.05, 3.05], [0, -0.05, 0]],
        [F + 9.6, [-1.05, 0.05, 2.5], [0, 0.05, -0.25]],
        [F + 11.8, [1.15, -0.05, 2.5], [0, 0.05, -0.25]],
        [F + 13.2, [0.05, -1.05, 2.6], [0, 0.15, -0.25]],
        [F + 15.0, [0.42, -0.42, 1.85], [0.24, -0.25, 0.1]],
        [F + 18.6, [0.42, -0.42, 1.85], [0.24, -0.25, 0.1]],
        [F + FILM_AT, [0.0, 0.15, 3.3], [0, 0.35, 0]],
        [F + FILM_AT + 1.6, [0.0, 0.85, 3.7], [0, 1.45, 0]],
        [F + FILM_AT + FILM_LEN, [0.0, 0.85, 3.7], [0, 1.45, 0]],
        [F + FILM_AT + FILM_LEN + 1.8, [0.0, -0.05, 3.15], [0, -0.05, 0]],
        [END, [0.0, -0.05, 3.15], [0, -0.05, 0]]
      ];
      const sm = (x) => x * x * x * (x * (x * 6 - 15) + 10);
      const vPos = new THREE.Vector3(), vLook = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3();
      function setCam(tv) {
        let i = 0; while (i < K.length - 2 && tv > K[i + 1][0]) i++;
        const [t0, p0, l0] = K[i], [t1, p1, l1] = K[i + 1];
        const k = sm(THREE.MathUtils.clamp((tv - t0) / (t1 - t0), 0, 1));
        vPos.copy(a.fromArray(p0)).lerp(b.fromArray(p1), k);
        vLook.copy(a.fromArray(l0)).lerp(b.fromArray(l1), k);
        // 손떨림
        vPos.x += 0.012 * Math.sin(tv * 1.7) + 0.006 * Math.sin(tv * 4.3);
        vPos.y += 0.010 * Math.sin(tv * 1.3 + 1) + 0.005 * Math.sin(tv * 5.1);
        vLook.x += 0.006 * Math.sin(tv * 2.1 + 2);
        camera.position.copy(vPos); camera.up.set(0.03 * Math.sin(tv * 0.9), 1, 0); camera.lookAt(vLook);
        camera.updateMatrixWorld();
      }
      const proj = new THREE.Vector3();
      function toScreen(obj, oy = 0) {
        obj.getWorldPosition(proj); proj.y += oy; proj.project(camera);
        return { x: (proj.x * 0.5 + 0.5) * innerWidth, y: (-proj.y * 0.5 + 0.5) * innerHeight };
      }
      function finger(x, y, o, sc = 1) {
        fingerEl.style.left = x + "px"; fingerEl.style.top = y + "px"; fingerEl.style.opacity = o; fingerEl.style.transform = `scale(${sc})`;
      }

      let found = false, filmClicked = false, lastSwipeX = null, filmIdx = -1, filmTex = null;
      window.__demo = {
        fps: 30, duration: END,
        ready: () => new Promise((res) => { (function chk() { (modelRoot && videoReady && paneMat.map && stairsMat.map) ? res(true) : setTimeout(chk, 100); })(); }),
        async frame(tv) {
          const dt = 1 / 30;
          demoClock = tv;
          // 필름 리더
          const n = 3 - Math.floor(tv);
          document.getElementById("count").textContent = n > 0 ? n : "";
          document.getElementById("sweep").style.setProperty("--a", ((tv % 1) * 360) + "deg");
          leader.style.opacity = 1 - span(tv, 3.0, 3.5);
          leader.style.pointerEvents = "none";
          if (!found && tv >= F) { found = true; anchor.onTargetFound(); }
          guide.style.opacity = found ? 0 : span(tv, 3.0, 3.4);
          setCam(tv);
          const sq = tv - F;
          // 손가락: 텐트 돌리기(좌우로 두 번 쓸기)
          if (found && sq >= 15.4 && sq < 18.8) {
            const c = toScreen(tentHolder, TENT_SIZE * 0.45);
            const ph = span(sq, 15.6, 18.6);
            const sx = Math.sin(ph * Math.PI * 2) * 70;
            if (lastSwipeX !== null && modelRoot) modelRoot.rotation.y += (sx - lastSwipeX) * 0.022;
            lastSwipeX = sx;
            finger(c.x + sx, c.y, (span(sq, 15.4, 15.7) - span(sq, 18.5, 18.8)) * 0.95);
          } else if (found && sq >= FILM_AT - 0.9 && sq < FILM_AT + 0.4) {
            // 손가락: '본편 보기' 누르기
            const r = filmButton.getBoundingClientRect();
            const press = sq >= FILM_AT - 0.15 && sq < FILM_AT + 0.1;
            finger(r.left + r.width / 2, r.top + r.height / 2, (span(sq, FILM_AT - 0.9, FILM_AT - 0.6) - span(sq, FILM_AT + 0.1, FILM_AT + 0.4)) * 0.95, press ? 0.8 : 1);
            if (!filmClicked && sq >= FILM_AT) { filmClicked = true; filmButton.click(); }
          } else { finger(-100, -100, 0); lastSwipeX = null; }
          // 본편: 미리 뽑아 둔 본편 프레임(30fps)을 차례로 붙인다(헤드리스에선 영상 되감기가 화면에 안 잡혀서)
          if (screenOpen && screenMesh) {
            video.pause();
            const idx = Math.min(Math.floor((sq - FILM_AT) * 30) + 1, Math.round(FILM_LEN * 30));
            if (idx !== filmIdx) {
              filmIdx = idx;
              const tx = await loadTex(`./demo/film/${String(idx).padStart(4, "0")}.jpg`);
              if (tx) { if (filmTex) filmTex.dispose(); filmTex = tx; screenMesh.material.map = tx; screenMesh.material.needsUpdate = true; }
            }
          }
          if (found && sq >= FILM_AT + FILM_LEN - 0.2 && screenOpen) filmButton.click();
          if (seqStart >= 0) updateSequence(dt);
          updateVideoBar();
          if (videoBar && filmIdx > 0 && video.duration > 0) {          // 재생바도 본편 프레임에 맞춤
            const pr = Math.min(1, (filmIdx / 30) / video.duration);
            videoBar.fill.scale.x = Math.max(pr, 0.0001); videoBar.fill.position.x = -SCREEN_W / 2 + (SCREEN_W * pr) / 2;
          }
          fadeEl.style.opacity = span(tv, END - 1.0, END);
          renderer.autoClear = false; renderer.clear();
          renderer.render(bgScene, camera); renderer.clearDepth(); renderer.render(scene, camera);
        }
      };
    }

    // 시험용 훅(헤드리스 점검에서만 사용)
    window.__ar = { get visible() { return targetVisible; }, get seq() { return seqTime(); }, T, openFilm: () => filmButton.click(),
                  get film() { return video ? { t: video.currentTime, paused: video.paused, ready: videoReady, failed: videoFailed } : null; } };
  </script>
</body>
