<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>기생충 — 지하 2관 입장권</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
  <style>
    :root { --ink: #141414; --paper: #ECE8DF; --bar: 11vh; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { font-family: 'Pretendard', -apple-system, sans-serif; color: var(--paper); }
    #container { position: fixed; inset: 0; }
    #container video { object-fit: cover; }
    #touchArea { position: fixed; inset: 0; z-index: 5; touch-action: none; }

    /* 시네마 레터박스 */
    .bar { position: fixed; left: 0; right: 0; height: calc(var(--bar) + env(safe-area-inset-top)); background: #000; z-index: 15;
           display: flex; align-items: flex-end; justify-content: space-between; padding: 0 5vw 2.2vh; pointer-events: none; }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; height: calc(var(--bar) + env(safe-area-inset-bottom)); align-items: flex-start;
                  padding-top: 2vh; justify-content: center; gap: 10px; pointer-events: auto; }
    .bar .hall { font-size: 12px; letter-spacing: .18em; color: #8f8a82; }
    .bar .hall b { color: var(--paper); letter-spacing: .04em; font-weight: 700; margin-right: .5em; }
    #status { font-size: 12px; letter-spacing: .02em; color: var(--paper); }
    .bar button { border: 1px solid #4a4741; background: transparent; color: var(--paper); font: 500 13px 'Pretendard', sans-serif;
                  padding: 9px 14px; border-radius: 999px; touch-action: manipulation; }
    .bar button.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }

    /* 접속: 필름 리더 카운트다운 */
    #leader { position: fixed; inset: 0; z-index: 30; background: #111; display: flex; align-items: center; justify-content: center;
              transition: opacity .6s ease; }
    #leader.gone { opacity: 0; pointer-events: none; }
    .dial { position: relative; width: 62vmin; height: 62vmin; border-radius: 50%; }
    .dial::before, .dial::after { content: ''; position: absolute; background: #6b675f; }
    .dial::before { left: 50%; top: -12vmin; bottom: -12vmin; width: 1px; }
    .dial::after { top: 50%; left: -12vmin; right: -12vmin; height: 1px; }
    .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid #8f8a82; }
    .ring.in { inset: 9%; }
    .sweep { position: absolute; inset: 0; border-radius: 50%;
             background: conic-gradient(rgba(236,232,223,.22) var(--a, 0deg), transparent 0); }
    #count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font: 900 30vmin 'Noto Serif KR', 'Pretendard', serif; color: var(--paper); line-height: 1; }
    #leaderNote { position: absolute; bottom: 14vh; left: 0; right: 0; text-align: center; font-size: 13px; color: #8f8a82; letter-spacing: .04em; }

    /* 티켓 비추기 안내 */
    #guide { position: fixed; z-index: 8; left: 50%; top: 50%; width: 46vw; aspect-ratio: 105 / 148; transform: translate(-50%, -50%);
             border: 1px dashed rgba(236,232,223,.75); border-radius: 6px; pointer-events: none; transition: opacity .4s; }
    #guide span { position: absolute; left: 0; right: 0; bottom: -34px; text-align: center; font-size: 13px; color: var(--paper);
                  text-shadow: 0 1px 4px #000; }
    #guide.hide { opacity: 0; }

    /* 번개 */
    #flash { position: fixed; inset: 0; z-index: 12; background: #f4f7ff; opacity: 0; pointer-events: none; }

    #startButton { display: none; position: fixed; z-index: 40; left: 50%; top: 50%; transform: translate(-50%, -50%);
                   border: 0; border-radius: 999px; background: var(--paper); color: var(--ink); font: 600 16px 'Pretendard', sans-serif; padding: 14px 24px; }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="touchArea"></div>
  <div id="guide"><span>티켓을 테두리에 맞춰 비춰 주세요</span></div>
  <div id="flash"></div>

  <div class="bar top"><span class="hall"><b>지하 2관</b>기생충</span><span id="status">AR 준비 중</span></div>
  <div class="bar bottom">
    <button id="soundButton">소리 켜기</button>
    <button id="replay">다시 보기</button>
    <button id="reset">처음 자리로</button>
  </div>

  <div id="leader">
    <div class="dial"><div class="sweep" id="sweep"></div><div class="ring"></div><div class="ring in"></div><div id="count">3</div></div>
    <div id="leaderNote">곧 상영을 시작합니다</div>
  </div>
  <button id="startButton">카메라 시작</button>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MindARThree } from "mindar-image-three";

    // ───────── 설정 ─────────
    // wall: 벽에 붙인 티켓(기본) / table: 책상에 눕힌 티켓  →  주소 뒤에 ?mode=table
    const params = new URLSearchParams(location.search);
    const MODE = params.get("mode") === "table" ? "table" : "wall";
    const SKIP_INTRO = params.has("nointro");

    const FILES = {
      target: "./media/targets.mind",
      model: "./media/tent.glb",
      photo: "./media/photo_color.jpg",     // 티켓 사진의 컬러판(같은 자르기)
      band: "./media/band.png",             // 티켓에 인쇄된 띠를 그대로 자른 그림
      video: "./media/film.mp4",            // 42초 본편(없으면 스크린 생략)
      thunder: "./media/thunder.mp3",       // 효과음(없으면 생략)
      rain: "./media/rain.mp3"
    };

    // 티켓 치수(mm) → 마커 좌표(가로 1 = 105mm, 가운데가 원점, 위가 +y)
    const T_W = 105, T_H = 148;
    const mm = v => v / T_W;
    const MARKER_H = T_H / T_W;
    const rectFromTop = (left, top, w, h) => ({
      x: mm(left + w / 2) - 0.5, y: mm(T_H / 2 - (top + h / 2)), w: mm(w), h: mm(h)
    });
    const PHOTO = rectFromTop(6, 13.2, 93, 82);
    const BAND = rectFromTop(6, 55.6, 93, 9);
    const TEAR_Y = mm(T_H / 2 - 114);           // 절취선 = 1층 바닥선

    const TENT_SIZE = 0.62;                       // 텐트 높이(마커 가로 기준)
    const PLACE = {
      wall:  { tent: new THREE.Vector3(0.30, TEAR_Y, 0.26), screen: new THREE.Vector3(0, MARKER_H / 2 + 0.52, 0.02) },
      table: { tent: new THREE.Vector3(0.30, 0, -TEAR_Y), screen: new THREE.Vector3(0, 0.50, -(MARKER_H / 2 + 0.06)) }
    }[MODE];
    const SCREEN_W = 2.0;                          // 스크린 가로(마커 가로의 2배)

    // ───────── AR 기본 ─────────
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const soundButton = document.getElementById("soundButton");
    const touchArea = document.getElementById("touchArea");
    const guide = document.getElementById("guide");

    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: FILES.target,
      maxTrack: 1,
      uiLoading: "no", uiScanning: "no", uiError: "no",
      filterMinCF: 0.001, filterBeta: 50          // 떨림은 조금 줄이고, 움직일 때 늦게 따라오지 않게
    });
    const { renderer, scene, camera } = mindarThree;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const anchor = mindarThree.addAnchor(0);

    // 벽/책상 모드에 따라 '세워지는' 물체를 담는 무대
    const stage = new THREE.Group();
    if (MODE === "table") stage.rotation.x = Math.PI / 2;
    anchor.group.add(stage);

    // 이동 그룹(교수님 코드와 같은 구조: 대상별로 두 손가락 이동·확대)
    const modelMoveGroup = new THREE.Group();
    const backgroundMoveGroup = new THREE.Group();
    stage.add(modelMoveGroup, backgroundMoveGroup);
    const screenHome = PLACE.screen.clone();
    backgroundMoveGroup.position.copy(screenHome);

    // 티켓 면에 붙는 층(사진·띠): 항상 마커 평면 위
    const ticketLayer = new THREE.Group();
    anchor.group.add(ticketLayer);

    scene.add(new THREE.HemisphereLight(0xfff4e6, 0x30302c, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(-1, 2, 3);
    scene.add(key);

    // ───────── 티켓 위 층: 컬러 사진 + 띠 ─────────
    const texLoader = new THREE.TextureLoader();
    const loadTex = (url) => new Promise((res) => texLoader.load(url, (t) => { t.colorSpace = THREE.SRGBColorSpace; res(t); }, undefined, () => res(null)));

    const photoMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
    const photoMesh = new THREE.Mesh(new THREE.PlaneGeometry(PHOTO.w, PHOTO.h), photoMat);
    photoMesh.position.set(PHOTO.x, PHOTO.y, 0.001);
    photoMesh.renderOrder = 1;
    photoMesh.visible = false;
    ticketLayer.add(photoMesh);

    const bandMat = new THREE.MeshBasicMaterial({ color: 0x141414, transparent: true, opacity: 0 });
    const bandMesh = new THREE.Mesh(new THREE.PlaneGeometry(BAND.w * 1.02, BAND.h * 1.08), bandMat);
    bandMesh.position.set(BAND.x, BAND.y, 0.002);
    bandMesh.renderOrder = 2;
    ticketLayer.add(bandMesh);

    loadTex(FILES.photo).then((t) => { if (t) { photoMat.map = t; photoMat.needsUpdate = true; photoMesh.visible = true; } });
    loadTex(FILES.band).then((t) => { if (t) { bandMat.map = t; bandMat.color.set(0xffffff); bandMat.needsUpdate = true; } });

    // ───────── 텐트 ─────────
    let modelRoot = null;
    let initialFitScale = 1;
    const tentHolder = new THREE.Group();          // 등장 연출용(크기 0 → 1)
    tentHolder.position.copy(PLACE.tent);
    tentHolder.scale.setScalar(0.0001);
    modelMoveGroup.add(tentHolder);

    // 바닥 그림자(번진 원)
    const shadowTex = (() => {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d"); const grd = g.createRadialGradient(64, 64, 4, 64, 64, 62);
      grd.addColorStop(0, "rgba(0,0,0,.55)"); grd.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.002;
    shadow.scale.set(TENT_SIZE * 1.15, TENT_SIZE * 0.9, 1);
    tentHolder.add(shadow);

    new GLTFLoader().load(FILES.model, (gltf) => {
      const model = gltf.scene;
      const lights = [];
      model.traverse((o) => { if (o.isLight) lights.push(o); });
      lights.forEach((l) => l.parent.remove(l));   // 파일 속 조명은 빼고 장면 조명만 사용
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      if (!(size.y > 0)) return;
      initialFitScale = TENT_SIZE / size.y;
      model.position.set(-center.x, -box.min.y, -center.z);
      modelRoot = new THREE.Group();
      modelRoot.scale.setScalar(initialFitScale);
      modelRoot.add(model);
      tentHolder.add(modelRoot);
    }, undefined, () => console.log("텐트 모델 없음"));

    // ───────── 스크린(영상) ─────────
    let video = null, videoReady = false, videoFailed = false, soundEnabled = false;
    let screenMesh = null, videoBar = null;
    const screenHolder = new THREE.Group();          // 펼쳐지는 연출용
    screenHolder.scale.set(1, 0.0001, 1);
    backgroundMoveGroup.add(screenHolder);
    const VIDEO_BAR_H = 0.025, VIDEO_BAR_HIT = 0.10, VIDEO_BAR_GAP = 0.05;

    function buildScreen(w, h) {
      const ratio = h / w;
      const sh = SCREEN_W * ratio;
      const frame = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W + 0.04, sh + 0.04), new THREE.MeshBasicMaterial({ color: 0x050505 }));
      frame.position.z = -0.002;
      const tex = new THREE.VideoTexture(video); tex.colorSpace = THREE.SRGBColorSpace;
      screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W, sh), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
      screenHolder.add(frame, screenMesh);
      // 재생바(교수님 코드 구조 유지)
      const g = new THREE.Group(); g.position.set(0, -(sh / 2 + VIDEO_BAR_GAP), 0.001);
      const track = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W, VIDEO_BAR_H), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .5 }));
      const fill = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W, VIDEO_BAR_H), new THREE.MeshBasicMaterial({ color: 0xece8df }));
      fill.position.set(-SCREEN_W / 2, 0, 0.001); fill.scale.x = 0.0001;
      const hit = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W, VIDEO_BAR_HIT), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
      hit.position.z = 0.002;
      g.add(hit, track, fill);
      screenHolder.add(g);
      videoBar = { group: g, fill, hit };
      // 아래 끝을 기준으로 펼쳐지도록
      screenHolder.children.forEach((c) => (c.position.y += sh / 2));
      screenHolder.position.y = -sh / 2;
    }

    function updateVideoBar() {
      if (!videoBar || !video || !(video.duration > 0)) return;
      const p = THREE.MathUtils.clamp(video.currentTime / video.duration, 0, 1);
      videoBar.fill.scale.x = Math.max(p, 0.0001);
      videoBar.fill.position.x = -SCREEN_W / 2 + (SCREEN_W * p) / 2;
    }

    function loadVideo() {
      video = document.createElement("video");
      video.src = FILES.video; video.loop = true; video.muted = true; video.playsInline = true; video.preload = "auto";
      video.setAttribute("playsinline", ""); video.setAttribute("webkit-playsinline", "");
      video.addEventListener("loadedmetadata", () => {
        if (videoReady || videoFailed || !video.videoWidth) return;
        videoReady = true; buildScreen(video.videoWidth, video.videoHeight);
      });
      video.addEventListener("error", () => { videoFailed = true; });
      video.load();
    }
    loadVideo();

    function playVideo() {
      if (!video || !videoReady || videoFailed || !targetVisible) return;
      video.play().catch((e) => { if (e.name !== "NotAllowedError") videoFailed = true; });
    }

    // ───────── 소리 ─────────
    const sfx = {};
    ["thunder", "rain"].forEach((k) => {
      const a = new Audio(FILES[k]); a.preload = "auto"; a.addEventListener("error", () => (sfx[k] = null)); sfx[k] = a;
    });
    sfx.rain && (sfx.rain.loop = true, sfx.rain.volume = 0.35);
    function playSfx(k) { const a = sfx[k]; if (!a || !soundEnabled) return; try { a.currentTime = 0; a.play().catch(() => {}); } catch (_) {} }

    soundButton.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundButton.textContent = soundEnabled ? "소리 끄기" : "소리 켜기";
      soundButton.classList.toggle("on", soundEnabled);
      if (video) video.muted = !soundEnabled;
      if (soundEnabled && targetVisible) { playVideo(); sfx.rain && sfx.rain.play().catch(() => {}); }
      else if (sfx.rain) sfx.rain.pause();
    });

    // ───────── 등장 연출 ─────────
    // 0.15~0.95 색이 돌아옴 → 0.9~1.7 띠가 걷힘 → 1.7 번개 → 1.8~2.4 텐트 → 2.4~3.1 스크린
    const ease = {
      inOut: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
      out: (t) => 1 - Math.pow(1 - t, 3),
      back: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
    };
    const span = (t, a, b) => THREE.MathUtils.clamp((t - a) / (b - a), 0, 1);
    let seqStart = -1, flashed = false;

    function startSequence() {
      seqStart = performance.now(); flashed = false;
      bandMesh.position.x = BAND.x; bandMat.opacity = 1;
      photoMat.opacity = 0; tentHolder.scale.setScalar(0.0001); screenHolder.scale.y = 0.0001;
    }

    function updateSequence() {
      if (seqStart < 0) return;
      const t = (performance.now() - seqStart) / 1000;
      photoMat.opacity = ease.inOut(span(t, 0.15, 0.95));
      bandMesh.position.x = BAND.x + ease.inOut(span(t, 0.9, 1.7)) * 1.25;
      bandMat.opacity = 1 - span(t, 1.55, 1.75);
      if (t >= 1.7 && !flashed) { flashed = true; lightning(); }
      tentHolder.scale.setScalar(Math.max(0.0001, ease.back(span(t, 1.8, 2.4))));
      screenHolder.scale.y = Math.max(0.0001, ease.out(span(t, 2.4, 3.1)));
      if (t >= 2.4 && videoReady && video.paused && targetVisible) playVideo();
    }

    const flashEl = document.getElementById("flash");
    function lightning() {
      playSfx("thunder");
      flashEl.animate([{ opacity: 0 }, { opacity: .85, offset: .08 }, { opacity: .1, offset: .3 }, { opacity: .6, offset: .42 }, { opacity: 0 }],
                      { duration: 650, easing: "ease-out" });
    }

    document.getElementById("replay").addEventListener("click", () => { if (targetVisible) startSequence(); });

    // ───────── 인식 ─────────
    let targetVisible = false, started = false, starting = false, played = false;
    function updateStatus(text) {
      status.textContent = text || (!started ? "카메라 대기 중" : targetVisible ? "상영 중" : "티켓을 비춰 주세요");
    }

    anchor.onTargetFound = () => {
      targetVisible = true;
      guide.classList.add("hide");
      if (!played) { played = true; startSequence(); }
      else if (videoReady && screenHolder.scale.y > 0.5) playVideo();
      if (soundEnabled && sfx.rain) sfx.rain.play().catch(() => {});
      updateStatus();
    };
    anchor.onTargetLost = () => {
      targetVisible = false;
      guide.classList.remove("hide");
      if (video) video.pause();
      if (sfx.rain) sfx.rain.pause();
      updateStatus();
    };

    // ───────── 시작(필름 리더 → 카메라) ─────────
    const leader = document.getElementById("leader");
    function runLeader() {
      return new Promise((resolve) => {
        if (SKIP_INTRO) { leader.classList.add("gone"); return resolve(); }
        const count = document.getElementById("count"), sweep = document.getElementById("sweep");
        const t0 = performance.now(), DUR = 3000;
        (function tick() {
          const t = performance.now() - t0;
          const n = 3 - Math.floor(t / 1000);
          count.textContent = n > 0 ? n : "";
          sweep.style.setProperty("--a", ((t % 1000) / 1000) * 360 + "deg");
          if (t < DUR) requestAnimationFrame(tick); else { leader.classList.add("gone"); resolve(); }
        })();
      });
    }

    async function startAR() {
      if (started || starting) return;
      starting = true; startButton.style.display = "none";
      updateStatus("카메라 권한 확인 중");
      try {
        await mindarThree.start();
        started = true; starting = false;
        renderer.setAnimationLoop(() => { updateSequence(); updateVideoBar(); renderer.render(scene, camera); });
        updateStatus();
      } catch (err) {
        console.error("AR 시작 오류:", err);
        starting = false; updateStatus("카메라를 시작할 수 없습니다");
        startButton.style.display = "block";
      }
    }
    // 카메라를 먼저 켜 두고, 그동안 리더 카운트다운을 보여 준다
    startAR();
    runLeader();
    startButton.addEventListener("click", startAR);

    // ───────── 처음 자리로 ─────────
    document.getElementById("reset").addEventListener("click", () => {
      modelMoveGroup.position.set(0, 0, 0);
      backgroundMoveGroup.position.copy(screenHome);
      backgroundMoveGroup.scale.set(1, 1, 1);
      if (modelRoot) { modelRoot.scale.setScalar(initialFitScale); modelRoot.rotation.set(0, 0, 0); }
    });

    // ───────── 손가락 조작(교수님 코드 방식) ─────────
    // 한 손가락: 텐트 회전 / 스크린 위 좌우 끌기 = 재생 위치 / 스크린 톡 = 재생·정지
    // 두 손가락: 같은 대상 위에서 확대·축소 + 이동
    const activePointers = new Map();
    let previousX = 0, previousY = 0, pinchStartDistance = 0, pinchStartScale = 1;
    const ROTATION_SPEED = 0.01, TAP_MOVE_LIMIT = 10, TAP_MAX_TIME = 400, SEEK_SCREEN_WIDTH_RATIO = 0.25;
    let singleStartTarget = null, tapCandidate = false, tapStartX = 0, tapStartY = 0, tapStartTime = 0;

    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane();
    const pNormal = new THREE.Vector3(), pPoint = new THREE.Vector3(), hitPoint = new THREE.Vector3();

    function setRay(x, y) {
      const r = renderer.domElement.getBoundingClientRect();
      if (!r.width || !r.height) return false;
      ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
      camera.updateMatrixWorld();
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
      ray.setFromCamera(ndc, camera);
      anchor.group.updateMatrixWorld(true);
      return true;
    }
    // 화면 좌표 → 무대(stage) 좌표: 카메라 광선이 티켓 평면과 만나는 점을 무대 좌표로 바꾼다
    function screenToStage(x, y, out) {
      if (!setRay(x, y)) return false;
      pNormal.set(0, 0, 1).transformDirection(anchor.group.matrixWorld);
      pPoint.setFromMatrixPosition(anchor.group.matrixWorld);
      plane.setFromNormalAndCoplanarPoint(pNormal, pPoint);
      if (!ray.ray.intersectPlane(plane, hitPoint)) return false;
      out.copy(hitPoint); stage.worldToLocal(out); return true;
    }
    function seekFromScreen(x, y) {
      if (!video || !videoReady || !(video.duration > 0) || !videoBar) return;
      const local = new THREE.Vector3();
      if (!setRay(x, y)) return;
      const hits = ray.intersectObject(videoBar.hit, false);
      if (!hits.length) return;
      local.copy(hits[0].point); videoBar.group.worldToLocal(local);
      video.currentTime = THREE.MathUtils.clamp(local.x / SCREEN_W + 0.5, 0, 1) * video.duration;
    }
    function toggleVideo() {
      if (!video || !videoReady || !targetVisible) return;
      video.paused ? playVideo() : video.pause();
    }
    function pickTarget(x, y) {
      if (!setRay(x, y)) return null;
      if (modelRoot && ray.intersectObject(modelRoot, true).length) return "model";
      if (videoBar && ray.intersectObject(videoBar.hit, false).length) return "bar";
      if (screenMesh && ray.intersectObject(screenMesh, false).length) return "background";
      return null;
    }
    const pinchDist = () => { const p = [...activePointers.values()]; return p.length < 2 ? 0 : Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
    const pinchMid = () => { const p = [...activePointers.values()]; return p.length < 2 ? null : { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 }; };

    const dragPrev = new THREE.Vector3(), dragCurr = new THREE.Vector3();
    let dragHasPrev = false, dragTarget = null;
    function pickDragTarget() {
      const p = [...activePointers.values()];
      if (p.length < 2) return null;
      const a = pickTarget(p[0].x, p[0].y), b = pickTarget(p[1].x, p[1].y);
      if (!a || a !== b) return null;
      return a === "model" ? modelMoveGroup : backgroundMoveGroup;
    }

    touchArea.addEventListener("pointerdown", (e) => {
      if (!targetVisible) return;
      e.preventDefault();
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      touchArea.setPointerCapture(e.pointerId);
      if (activePointers.size === 1) {
        previousX = e.clientX; previousY = e.clientY;
        singleStartTarget = pickTarget(e.clientX, e.clientY);
        if (singleStartTarget === "bar") seekFromScreen(e.clientX, e.clientY);
        tapCandidate = true; tapStartX = e.clientX; tapStartY = e.clientY; tapStartTime = performance.now();
      }
      if (activePointers.size === 2) {
        singleStartTarget = null; tapCandidate = false;
        pinchStartDistance = pinchDist();
        dragTarget = pickDragTarget();
        pinchStartScale = dragTarget === modelMoveGroup && modelRoot ? modelRoot.scale.x : dragTarget ? dragTarget.scale.x : 1;
        updateStatus(dragTarget === modelMoveGroup ? "이동 중: 텐트" : dragTarget ? "이동 중: 스크린" : "이동 대상 없음");
        const m = pinchMid();
        dragHasPrev = m && dragTarget ? screenToStage(m.x, m.y, dragPrev) : false;
      }
    });

    touchArea.addEventListener("pointermove", (e) => {
      if (!activePointers.has(e.pointerId)) return;
      e.preventDefault();
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 1) {
        if (tapCandidate && Math.hypot(e.clientX - tapStartX, e.clientY - tapStartY) > TAP_MOVE_LIMIT) tapCandidate = false;
        const dx = e.clientX - previousX, dy = e.clientY - previousY;
        if (singleStartTarget === "background") {
          if (!tapCandidate && video && videoReady && video.duration > 0)
            video.currentTime = THREE.MathUtils.clamp(video.currentTime + (dx / innerWidth) * video.duration * SEEK_SCREEN_WIDTH_RATIO, 0, video.duration);
        } else if (singleStartTarget === "bar") {
          seekFromScreen(e.clientX, e.clientY);
        } else if (modelRoot) {
          modelRoot.rotation.y += dx * ROTATION_SPEED;
          modelRoot.rotation.x += dy * ROTATION_SPEED;
        }
        previousX = e.clientX; previousY = e.clientY;
      } else if (activePointers.size === 2) {
        if (dragTarget && pinchStartDistance > 0) {
          const s = pinchStartScale * (pinchDist() / pinchStartDistance);
          if (dragTarget === modelMoveGroup && modelRoot) modelRoot.scale.setScalar(THREE.MathUtils.clamp(s, initialFitScale * 0.1, initialFitScale * 10));
          else if (dragTarget) dragTarget.scale.setScalar(THREE.MathUtils.clamp(s, 0.1, 10));
        }
        const m = pinchMid();
        if (m && dragTarget) {
          if (!dragHasPrev) dragHasPrev = screenToStage(m.x, m.y, dragPrev);
          else if (screenToStage(m.x, m.y, dragCurr)) {
            dragTarget.position.add(dragCurr.clone().sub(dragPrev));
            dragPrev.copy(dragCurr);
          }
        }
      }
    });

    function stopPointer(e) {
      if (!activePointers.has(e.pointerId)) return;
      if (e.type === "pointerup" && activePointers.size === 1 && tapCandidate && singleStartTarget === "background" &&
          performance.now() - tapStartTime < TAP_MAX_TIME) toggleVideo();
      tapCandidate = false; singleStartTarget = null;
      activePointers.delete(e.pointerId);
      dragHasPrev = false; dragTarget = null;
      updateStatus();
      if (activePointers.size === 1) { const r = [...activePointers.values()][0]; previousX = r.x; previousY = r.y; }
      else if (activePointers.size === 0) pinchStartDistance = 0;
    }
    touchArea.addEventListener("pointerup", stopPointer);
    touchArea.addEventListener("pointercancel", stopPointer);
    touchArea.addEventListener("lostpointercapture", stopPointer);

    // 시험용 훅(헤드리스 점검에서만 사용)
    window.__ar = { get visible() { return targetVisible; }, get seq() { return seqStart < 0 ? -1 : (performance.now() - seqStart) / 1000; } };
  </script>
</body>
</html>
